<!doctype html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Página de Login</title>

    <link rel="stylesheet" href="../css/index.css?v=7">
    <link rel="stylesheet" href="../css/global.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <!-- LADO ESQUERDO -->
    <div class="left-side">
        <img src="../img/i1.jpg" alt="Imagem solidária">
    </div>

    <!-- LADO DIREITO -->
    <div class="right-side">

        <img src="../img/logo.png" alt="Logo" class="logo-form">

        <form onsubmit="event.preventDefault(); if(isEmailValid() &amp;&amp; isPasswordValid()) login();">

            <h1>Entrar</h1><p>Acesse sua conta no Projeto Caridade.</p>
<!-- EMAIL -->
            <div class="form-field">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email" autocomplete="email" required
                    placeholder="seu@email.com"
                    oninput="onChangeEmail()"
                />

                <div aria-live="polite" class="error" id="email-required-error">Email é obrigatório</div>
                <div aria-live="polite" class="error" id="email-invalid-error">Email inválido</div>
            </div>

            <!-- SENHA -->
            <div class="form-field">
                <label for="password">Senha</label>
                <input
                    type="password"
                    id="password" autocomplete="current-password" required
                    placeholder="Senha"
                    oninput="onChangePassword()"
                />

                <div aria-live="polite" class="error" id="password-required-error">Senha é obrigatória</div>
            </div>

            <!-- BOTÕES -->
            <div>
                <button
                    type="button"
                    class="clear"
                    id="recover-password-button"
                    onclick="recoverPassword()"
                    disabled
                >
                    Recuperar senha
                </button>
            </div>

            <div>
                <button
                    type="submit"
                    class="solid"
                    id="login-button"

                    disabled
                >
                    Entrar
                </button>
            </div>

            <div>
                <button
                    type="button"
                    class="outline"
                    onclick="register()"
                >
                    Registrar
                </button>
            </div>

        </form>

    </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>

<script src="../js/firebase-init.js"></script>

<!-- SEU JS -->
<script src="../js/index.js"></script>
<script src="../js/validations.js"></script>
<script src="../js/loading.js"></script>

</body>
</html>
